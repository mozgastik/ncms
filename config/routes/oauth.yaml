connect_google_start:
    path: /connect/google
    controller: App\Controller\Auth\OAuthController::connectGoogle
    methods: GET

connect_google_check:
    path: /connect/google/check
    controller: App\Controller\Auth\OAuthController::connectGoogleCheck
    methods: GET

connect_facebook_start:
    path: /connect/facebook
    controller: App\Controller\Auth\OAuthController::connectFacebook
    methods: GET

connect_facebook_check:
    path: /connect/facebook/check
    controller: App\Controller\Auth\OAuthController::connectFacebookCheck
    methods: GET