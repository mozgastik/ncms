quill_js:
    # Тема за замовчуванням
    default_theme: 'snow'
    
    # Повний набір інструментів (кожна група в окремих дужках [])
    toolbar_options:
        - ['bold', 'italic', 'underline', 'strike']        # Форматування тексту
        - ['blockquote', 'code-block']
        - [{ 'header': 1 }, { 'header': 2 }]               # Швидкі заголовки H1, H2
        - [{ 'list': 'ordered'}, { 'list': 'bullet' }]     # Списки
        - [{ 'script': 'sub'}, { 'script': 'super' }]      # Індекси
        - [{ 'indent': '-1'}, { 'indent': '+1' }]          # Відступи
        - [{ 'size': ['small', false, 'large', 'huge'] }]  # Розмір тексту
        - [{ 'header': [1, 2, 3, 4, 5, 6, false] }]        # Вибір заголовків
        - [{ 'color': [] }, { 'background': [] }]          # Колір тексту та фону
        - [{ 'font': [] }]                                 # Шрифти
        - [{ 'align': [] }]                                # Вирівнювання тексту
        - ['link', 'image', 'video']                       # Посилання, фото, відео
        - ['clean']                                        # Кнопка очищення форматів
